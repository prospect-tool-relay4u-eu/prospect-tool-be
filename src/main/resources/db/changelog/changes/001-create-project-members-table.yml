databaseChangeLog:
  - changeSet:
      id: 001-create-project-members-table
      author: wojtek
      changes:
        - createTable:
            tableName: project_members
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: role
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: invited_email
                  type: VARCHAR(255)
              - column:
                  name: invited_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: project_members
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            constraintName: fk_project_members_project
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: project_members
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_project_members_user
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: project_members
            columnNames: project_id, user_id
            constraintName: uk_project_members_project_user
