spring.application.name=eu-relay-4u-prospecting-be
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eu_relay_4u_prospecting}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=db/changelog/db.changelog-master.yaml
logging.level.liquibase=DEBUG

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Auth (validated against relay4u-auth-service-be's JWKS)
auth.service.jwks-uri=${AUTH_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
auth.service.issuer=${AUTH_SERVICE_ISSUER:https://auth.relay4u.eu}
